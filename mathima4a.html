<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Μάθημα 4: Πού θα φτάσει η σαρανταποδαρούσα; | Α΄ Δημοτικού</title>
<style>
:root{
  --green-main:#2e7d32;--green-light:#e8f5e9;--accent:#ffb300;
  --purple:#5e35b1;--panel:#ffffff;--text:#263238;
}
*{box-sizing:border-box}
body{
  margin:0;background:radial-gradient(circle,#e8f5e9 0%,#c8e6c9 100%);
  font-family:"Comfortaa","Trebuchet MS",sans-serif;color:var(--text);font-size:18px;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px;
}
header{
  width:100%;max-width:980px;background:#ffffffcc;border-radius:24px;
  padding:16px 20px;text-align:center;box-shadow:0 8px 24px rgba(46,125,50,0.12);
  border:3px solid #a5d6a7;margin-bottom:12px;
}
h1{margin:4px 0;color:var(--green-main);font-size:clamp(22px,4vw,34px)}
.status-bar{
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;
  gap:10px;margin-top:10px;font-weight:bold;background:#fff;padding:8px 16px;border-radius:16px;
}
.tabs{
  display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:980px;margin-bottom:12px;
}
.tab-btn{
  background:#fff;border:3px solid #a5d6a7;color:var(--green-main);font-weight:bold;
  border-radius:18px;padding:8px 12px;cursor:pointer;font-size:15px;box-shadow:0 3px 0 #81c784;
  transition:all .15s;
}
.tab-btn:hover{transform:translateY(-2px);background:#f1f8e9}
.tab-btn.active{background:var(--green-main);color:#fff;border-color:#1b5e20;box-shadow:0 0 12px rgba(46,125,50,0.4)}
.stage-card{
  width:100%;max-width:980px;background:var(--panel);border-radius:28px;
  border:4px solid #a5d6a7;box-shadow:0 12px 32px rgba(0,0,0,0.1);padding:20px;
  display:flex;flex-direction:column;align-items:center;position:relative;
}
.stage-header{
  width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;
}
.mission-title{font-size:clamp(17px,2.5vw,22px);font-weight:bold;color:var(--green-main)}
.btn-speaker{
  background:#ffe082;border:2px solid #ffa000;width:48px;height:48px;border-radius:50%;
  font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 0 #ff8f00;
}
.btn-speaker:hover{transform:scale(1.08)}
.grid-board{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:320px;width:100%;
  aspect-ratio:1;background:#f1f8e9;padding:8px;border-radius:20px;border:3px solid #c5e1a5;
}
.grid-cell{
  background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:36px;border:2px solid #dcedc8;box-shadow:inset 0 2px 4px rgba(0,0,0,0.04);
}
.grid-cell.active-step{background:#fff9c4;border-color:#fbc02d}
.path-display{
  display:flex;gap:8px;align-items:center;background:#f5f5f5;border:2px dashed #b0bec5;
  border-radius:16px;padding:8px 14px;margin:14px 0;font-size:26px;flex-wrap:wrap;justify-content:center;
}
.choices-row{
  display:flex;gap:12px;margin:12px 0;flex-wrap:wrap;justify-content:center;
}
.target-btn{
  background:#fff;border:3px solid #b0bec5;border-radius:20px;padding:10px 18px;
  font-size:32px;cursor:pointer;box-shadow:0 4px 0 #90a4ae;transition:transform .15s;
}
.target-btn:hover{transform:translateY(-3px);border-color:var(--green-main)}
.feedback-box{min-height:36px;font-size:19px;font-weight:bold;margin-top:10px;text-align:center}
#confettiCanvas{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:9999}
</style>
</head>
<body>
<canvas id="confettiCanvas"></canvas>

<header>
  <h1>🐛 Πού θα φτάσει η σαρανταποδαρούσα;</h1>
  <div class="status-bar">
    <span>⭐ Αστέρια: <span id="starCount">0</span> / 8</span>
    <span id="cheerMsg">Διάλεξε αποστολή και βρες τον προορισμό!</span>
    <button onclick="downloadSelf()" style="background:#00897b;color:#fff;border:0;border-radius:12px;padding:6px 12px;cursor:pointer;font-weight:bold">💾 Λήψη</button>
  </div>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="loadMission(1)">1. 🌸 Προς το λουλούδι</button>
  <button class="tab-btn" onclick="loadMission(2)">2. 🍎 Προς το μήλο</button>
  <button class="tab-btn" onclick="loadMission(3)">3. 🍃 Προς το φύλλο</button>
  <button class="tab-btn" onclick="loadMission(4)">4. 🍓 Προς τη φράουλα</button>
  <button class="tab-btn" onclick="loadMission(5)">5. 🍄 Προς το μανιτάρι</button>
  <button class="tab-btn" onclick="loadMission(6)">6. 👣 Πόσα βήματα;</button>
  <button class="tab-btn" onclick="loadMission(7)">7. 🛑 Ποιο είναι εμπόδιο;</button>
  <button class="tab-btn" onclick="loadMission(8)">8. 🎨 Βρες το τέρμα</button>
</div>

<div class="stage-card">
  <div class="stage-header">
    <div id="missionHeading" class="mission-title">Αποστολή</div>
    <button class="btn-speaker" onclick="speakMission()" title="Άκουσε την αποστολή">🔊</button>
  </div>
  <div id="gameArea" style="width:100%;display:flex;flex-direction:column;align-items:center;"></div>
  <div id="feedbackBox" class="feedback-box"></div>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playTone(freq, dur=0.1){
  try{
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.frequency.value=freq; o.connect(g); g.connect(audioCtx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}
function soundOk(){
  playTone(523,0.08); setTimeout(()=>playTone(659,0.08),70);
  setTimeout(()=>playTone(784,0.12),140); setTimeout(()=>playTone(1046,0.2),210);
  fireConfetti();
}
function soundErr(){ playTone(220,0.18); setTimeout(()=>playTone(180,0.2),100); }

function fireConfetti(){
  const cv=document.getElementById('confettiCanvas'), ctx=cv.getContext('2d');
  cv.width=window.innerWidth; cv.height=window.innerHeight;
  const p=Array.from({length:55},()=>({
    x:cv.width/2, y:cv.height/2, vx:(Math.random()-0.5)*14, vy:(Math.random()-0.5)*14-3,
    size:Math.random()*8+6, col:['#2e7d32','#ffca28','#66bb6a','#00b0ff','#f50057'][Math.floor(Math.random()*5)]
  }));
  let f=0;
  function anim(){
    ctx.clearRect(0,0,cv.width,cv.height);
    p.forEach(i=>{ i.x+=i.vx; i.y+=i.vy; i.vy+=0.3; ctx.fillStyle=i.col; ctx.beginPath(); ctx.arc(i.x,i.y,i.size/2,0,Math.PI*2); ctx.fill(); });
    if(++f < 45) requestAnimationFrame(anim); else ctx.clearRect(0,0,cv.width,cv.height);
  }
  anim();
}

let completed=new Set(), stars=0, curMission=1;

function markDone(n, msg){
  if(!completed.has(n)){ completed.add(n); stars++; }
  document.getElementById('starCount').textContent=stars;
  document.getElementById('cheerMsg').textContent=msg||'Μπράβο! Συνέχισε!';
}

function speakText(t){
  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.lang='el-GR'; u.rate=0.88; window.speechSynthesis.speak(u);
  }
}

const missions = {
  1: {
    title: "1. Ακολούθησε τα βέλη! Σε ποιο λουλούδι φτάνει; 🌸",
    speech: "Κοίταξε τα βέλη. Σε ποιο λουλούδι θα φτάσει η σαρανταποδαρούσα;",
    path: ['➡️', '➡️', '⬇️'],
    start: 0,
    targets: { 6: '🌸', 2: '🌼', 7: '🌺' },
    goalCell: 6,
    goalIcon: '🌸'
  },
  2: {
    title: "2. Πού θα φτάσει; Στο κόκκινο ή στο πράσινο μήλο; 🍎",
    speech: "Ακολούθησε τα βήματα με τα μάτια. Ποιο φρούτο θα συναντήσει;",
    path: ['⬇️', '⬇️', '➡️'],
    start: 0,
    targets: { 9: '🍎', 8: '🍏', 10: '🍐' },
    goalCell: 9,
    goalIcon: '🍎'
  },
  3: {
    title: "3. Προχώρα δεξιά και κάτω! Ποιο φύλλο θα βρει; 🍃",
    speech: "Ποιο πράσινο φύλλο θα βρει στο τέλος του δρόμου;",
    path: ['➡️', '⬇️', '➡️', '⬇️'],
    start: 0,
    targets: { 10: '🍃', 9: '🍂', 11: '🌿' },
    goalCell: 10,
    goalIcon: '🍃'
  },
  4: {
    title: "4. Ποια λιχουδιά περιμένει τη σαρανταποδαρούσα; 🍓",
    speech: "Ακολούθησε τις εντολές των βελών και βρες τη σωστή λιχουδιά!",
    path: ['➡️', '➡️', '➡️', '⬇️'],
    start: 0,
    targets: { 7: '🍓', 3: '🍒', 6: '🍇' },
    goalCell: 7,
    goalIcon: '🍓'
  },
  5: {
    title: "5. Ποιο μανιτάρι είναι στον δρόμο της; 🍄",
    speech: "Ξεκινάμε από κάτω. Ποιο μανιτάρι θα βρει η σαρανταποδαρούσα;",
    path: ['⬆️', '⬆️', '➡️'],
    start: 12,
    targets: { 5: '🍄', 4: '🌰', 6: '🌼' },
    goalCell: 5,
    goalIcon: '🍄'
  },
  6: {
    title: "6. Πόσα βήματα κάνει συνολικά; 👣",
    speech: "Μέτρησε πόσα βελάκια έχει το πρόγραμμα και πάτησε τον σωστό αριθμό!",
    type: 'count',
    path: ['➡️', '➡️', '⬇️', '⬇️'],
    answers: ['3', '4', '5'],
    correct: '4'
  },
  7: {
    title: "7. Ποιο εμπόδιο πρέπει να αποφύγει; 🛑",
    speech: "Ποιο πράγμα είναι εμπόδιο και δεν πρέπει να πατήσει;",
    type: 'obstacle',
    options: ['🪨 Πέτρα', '🍃 Φύλλο', '💧 Νερό'],
    correct: 0
  },
  8: {
    title: "8. Βρες το σωστό τέρμα της διαδρομής! 🎯",
    speech: "Κοίταξε προσεκτικά το μεγάλο μονοπάτι και βρες πού τερματίζει!",
    path: ['➡️', '⬇️', '⬇️', '➡️'],
    start: 0,
    targets: { 10: '⭐', 9: '💎', 14: '🏆' },
    goalCell: 10,
    goalIcon: '⭐'
  }
};

function loadMission(id){
  curMission = id;
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active', i+1===id));
  document.getElementById('missionHeading').textContent = missions[id].title;
  document.getElementById('feedbackBox').textContent = '';
  document.getElementById('feedbackBox').style.color = 'var(--green-main)';
  renderMissionArea(missions[id]);
  speakMission();
}

function speakMission(){ speakText(missions[curMission].speech); }

function renderMissionArea(m){
  const area = document.getElementById('gameArea');
  if(m.type === 'count'){
    area.innerHTML = `
      <div class="path-display">${m.path.map(p=>`<span>${p}</span>`).join(' ')}</div>
      <p style="font-size:20px;font-weight:bold;margin:10px 0;">Μέτρησε τα βελάκια:</p>
      <div class="choices-row">
        ${m.answers.map(a=>`<button class="target-btn" style="padding:12px 26px;font-size:28px;font-weight:bold;" onclick="checkCount('${a}','${m.correct}')">${a}</button>`).join('')}
      </div>
    `;
    return;
  }
  if(m.type === 'obstacle'){
    area.innerHTML = `
      <div style="font-size:60px;margin:10px 0;">🪨 🍃 💧</div>
      <p style="font-size:20px;font-weight:bold;margin:10px 0;">Ποιο από αυτά είναι σκληρό εμπόδιο;</p>
      <div class="choices-row">
        ${m.options.map((opt,idx)=>`<button class="target-btn" style="font-size:22px;font-weight:bold;" onclick="checkObstacle(${idx},${m.correct})">${opt}</button>`).join('')}
      </div>
    `;
    return;
  }

  area.innerHTML = `
    <div class="path-display">
      <span>Διαδρομή:</span> ${m.path.map(p=>`<span>${p}</span>`).join(' ')}
    </div>
    <div class="grid-board" id="boardGrid"></div>
    <p style="font-size:18px;font-weight:bold;margin:12px 0 6px;">Πού θα φτάσει; Πάτησε το σωστό:</p>
    <div class="choices-row" id="choicesTarget">
      ${Object.values(m.targets).map(icon=>`<button class="target-btn" onclick="checkTargetChoice('${icon}','${m.goalIcon}')">${icon}</button>`).join('')}
    </div>
  `;
  drawGridCells(m, m.start);
}

function drawGridCells(m, curPos){
  const b = document.getElementById('boardGrid');
  if(!b) return;
  b.innerHTML = '';
  for(let i=0; i<16; i++){
    const cell = document.createElement('div');
    cell.className = 'grid-cell' + (i === curPos ? ' active-step' : '');
    if(i === curPos) cell.textContent = '🐛';
    else if(m.targets[i]) cell.textContent = m.targets[i];
    b.appendChild(cell);
  }
}

function checkTargetChoice(chosen, correct){
  const fb = document.getElementById('feedbackBox');
  if(chosen === correct){
    soundOk();
    fb.style.color = 'var(--green-main)';
    fb.textContent = '🎉 ΜΠΡΑΒΟ! Ακολούθησες σωστά τα βήματα της σαρανταποδαρούσας!';
    animateCaterpillar();
    markDone(curMission, 'Έξοχη παρατήρηση διαδρομής!');
  } else {
    soundErr();
    fb.style.color = '#c62828';
    fb.textContent = '❌ Για δες ξανά τα βελάκια ένα-ένα!';
  }
}

function animateCaterpillar(){
  const m = missions[curMission];
  let pos = m.start;
  let i = 0;
  function step(){
    if(i < m.path.length){
      const dir = m.path[i];
      if(dir === '➡️' && pos%4 < 3) pos++;
      else if(dir === '⬅️' && pos%4 > 0) pos--;
      else if(dir === '⬇️' && pos < 12) pos += 4;
      else if(dir === '⬆️' && pos >= 4) pos -= 4;
      playTone(500 + i*60, 0.08);
      drawGridCells(m, pos);
      i++;
      setTimeout(step, 350);
    }
  }
  step();
}

function checkCount(chosen, correct){
  const fb = document.getElementById('feedbackBox');
  if(chosen === correct){
    soundOk();
    fb.style.color = 'var(--green-main)';
    fb.textContent = '🎉 ΣΩΣΤΑ! Η σαρανταποδαρούσα έκανε 4 βήματα!';
    markDone(6, 'Άριστο μέτρημα βημάτων!');
  } else {
    soundErr();
    fb.style.color = '#c62828';
    fb.textContent = '❌ Μέτρησε ξανά τα βελάκια ένα προς ένα!';
  }
}

function checkObstacle(chosen, correct){
  const fb = document.getElementById('feedbackBox');
  if(chosen === correct){
    soundOk();
    fb.style.color = 'var(--green-main)';
    fb.textContent = '🌟 ΜΠΡΑΒΟ! Η πέτρα είναι εμπόδιο και πρέπει να την αποφύγουμε!';
    markDone(7, 'Αποφυγή εμποδίων!');
  } else {
    soundErr();
    fb.style.color = '#c62828';
    fb.textContent = '❌ Αυτό δεν εμποδίζει τη σαρανταποδαρούσα. Σκέψου ξανά!';
  }
}

function downloadSelf(){
  const blob = new Blob(["<!DOCTYPE html>\n" + document.documentElement.outerHTML], {type: "text/html;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "mathima_04_sarantapodarousa.html";
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(a.href);
}

window.onload = () => loadMission(1);
</script>
</body>
</html>
