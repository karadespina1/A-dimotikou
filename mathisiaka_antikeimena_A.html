.unit>h2 span.k{background:rgba(255,255,255,.28);color:#fff;border-radius:8px;padding:2px 9px;font-size:.85rem;white-space:nowrap}
.lessons{list-style:none;margin:0;padding:6px}
.lessons li{border-radius:10px}.lessons button{width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;gap:12px;align-items:center}
.lessons button:hover,.lessons button:focus-visible{background:var(--ac2);outline:none}
.num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--uc);color:#fff;font-weight:700;display:grid;place-items:center}
.cnt{margin-left:auto;flex:none;font-size:.8rem;color:var(--mu)}.chev{flex:none;transition:transform .2s;color:var(--mu)}li.open>button .chev{transform:rotate(180deg)}li.open>button{background:var(--ac2)}.lessons button:hover,.lessons button:focus-visible{background:var(--ac2)}.acts{display:none;padding:6px 6px 10px 56px}li.open>.acts{display:block}
.obj{border-left:6px solid var(--uc)!important;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px;text-decoration:none;color:inherit}
.obj:hover{transform:translateY(-2px);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.ic{font-size:1.6rem;flex:none}.ot{font-weight:600}.ty{font-size:.82rem;color:var(--mu)}
.go{margin-left:auto;color:var(--uc);font-weight:600;white-space:nowrap}
.empty{color:var(--mu);padding:4px 0}
.obj{margin-bottom:8px}@media(max-width:520px){.acts{padding-left:8px}.go{display:none}}

  [/^Παιχνίδι|^Εκπαιδευτικό παιχνίδι/, "🎮"],
  [/^Κουίζ/, "❓"],
  [/^Τεστ/, "📝"],
  [/^Άσκηση|^Δραστηριότητα/, "✏️"],
  [/^Διαδραστικ/, "🖱️"],
  [/^Εικόνα/, "🖼️"],
  [/^Αφίσα/, "🪧"],
  [/ρόλεξο|^Κρυπτ/, "🔤"],
  [/^Εφαρμογή|Scratchjr|Φωτόδεντρο/, "💻"],
  [/^Κάρτες/, "🃏"],
  [/^Παρουσίαση/, "📊"],
  [/βιβλί|ιστοσελίδα/i, "🌐"]
];

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function icon(t) {
  for (const [r, i] of ICONS) if (r.test(t)) return i;
  return "🔗";
}

function split(t) {
  const m = t.match(/^((?:Άσκηση|Βίντεο|Παιχνίδι|Εκπαιδευτικό παιχνίδι|Εικόνα|Διαδραστική εικόνα|Τεστ αξιολόγησης|Αφίσα|Παρουσίαση|Εφαρμογή|Δραστηριότητα|Κουίζ)[^.:]{0,35})[.:]\s+(.+)$/);
  return m ? [m[1], m[2]] : ["", t];
}

function actHTML(l) {
  return l.o.length ? l.o.map(o => {
    const [ty, ti] = split(o.t);
    return `<a class="obj" href="${esc(o.u)}" target="_blank" rel="noopener noreferrer"><span class="ic">${icon(o.t)}</span><span><div class="ot">${esc(ti)}</div><div class="ty">${ty ? esc(ty) + " · " : ""}σελ. ${o.p}</div></span><span class="go">Άνοιγμα ↗</span></a>`;
  }).join("") : `<p class="empty">Αυτό το μάθημα δεν έχει QR codes.</p>`;
}

function renderList() {
  $("#list").innerHTML = DATA.units.map((u, i) =>
    `<div class="unit" style="--uc:${UC[i]}"><h2><span class="k">Ενότητα ${i + 1}</span>${esc(u.t)}</h2><ul class="lessons">` +
    u.l.map(l =>
      `<li id="m${l.n}"><button aria-expanded="false" aria-controls="a${l.n}" data-n="${l.n}"><span class="num">${l.n}</span><span>${esc(l.t)}</span><span class="cnt">${l.o.length} δραστ.</span><span class="chev">▾</span></button><div class="acts" id="a${l.n}">${actHTML(l)}</div></li>`
    ).join("") + `</ul></div>`
  ).join("");

  $("#list").querySelectorAll("button[data-n]").forEach(b => b.onclick = () => {
    const li = b.parentElement, o = li.classList.toggle("open");
    b.setAttribute("aria-expanded", o);
  });
}

renderList();
</script>
</body>
</html>
